<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6"/>
      <stop offset="100%" style="stop-color:#6D28D9"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#6D28D9" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Rounded square background -->
  <rect x="32" y="32" width="448" height="448" rx="96" ry="96"
        fill="url(#bgGrad)" filter="url(#shadow)"/>

  <!-- Geometric M shape - two vertical bars -->
  <rect x="112" y="144" width="48" height="224" rx="8" fill="#FFFFFF"/>
  <rect x="352" y="144" width="48" height="224" rx="8" fill="#FFFFFF"/>

  <!-- Center diamond -->
  <polygon points="256,176 304,256 256,336 208,256" fill="#FFFFFF" opacity="0.9"/>
</svg>
