# mdview Light Theme

[colors]
background = "#ffffff"
text = "#333333"
heading = "#0066cc"
link = "#0077cc"
code_background = "#f5f5f5"
code_text = "#d73a49"
sidebar_background = "#f3f3f3"
selection = "#add6ff"

[fonts]
body = "sans-serif"
heading = "sans-serif"
code = "monospace"
size = 14.0
line_height = 1.5

[spacing]
paragraph = 12.0
heading_top = 24.0
heading_bottom = 8.0
list_indent = 20.0
code_padding = 8.0
